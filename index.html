<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#032830" />
    <meta
      name="description"
      content="KITOS Mariscos - Pedidos por WhatsApp."
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <title>KITOS Mariscos</title>
  </head>
  <body>
    <div id="root">
      <main
        id="app-loading"
        style="min-height:100vh;display:grid;place-items:center;background:#f7f0e6;color:#032830;font-family:system-ui,sans-serif;text-align:center;padding:2rem"
      >
        <div>
          <h1 style="margin:0;font-size:2.25rem">KITOS Mariscos</h1>
          <p>Cargando menu...</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Activa JavaScript para ver el menu de KITOS Mariscos.</noscript>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (root && document.getElementById('app-loading')) {
          root.innerHTML =
            '<main style="font-family:system-ui;padding:2rem;text-align:center;max-width:28rem;margin:4rem auto">' +
            '<h1>KITOS Mariscos</h1>' +
            '<p>No se pudo cargar la app.</p>' +
            '<p>Prueba <strong>Ctrl+F5</strong> o abre en una ventana de <strong>incognito</strong>.</p>' +
            '<p><a href="./?v=' + Date.now() + '">Reintentar</a></p>' +
            '</main>'
        }
      }, 4000)
    </script>
  </body>
</html>
